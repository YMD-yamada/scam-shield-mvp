<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScamShield — 詐欺サイト撲滅</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #102a2a;
        --muted: #4a6565;
        --paper: #e8f2ef;
        --panel: #f7fbf9;
        --accent: #0f6b5c;
        --accent-deep: #08493f;
        --warn: #a85b00;
        --danger: #b42318;
        --safe: #1b7a3d;
        --line: #c5d9d3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans JP", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 500px at 10% -10%, #cfe8e0 0%, transparent 55%),
          linear-gradient(180deg, #d7ebe4 0%, var(--paper) 40%, #eef5f2 100%);
        min-height: 100vh;
      }
      header {
        padding: 28px 20px 18px;
        background: linear-gradient(135deg, var(--accent-deep), var(--accent));
        color: #f4fffb;
      }
      header h1 {
        margin: 0;
        font-family: "Source Serif 4", serif;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        letter-spacing: 0.02em;
      }
      header p { margin: 8px 0 0; opacity: 0.92; max-width: 40rem; }
      main { max-width: 920px; margin: 18px auto 28px; padding: 0 14px; display: grid; gap: 14px; }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      h2 { margin: 0 0 10px; font-size: 1.1rem; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
      input, textarea, select, button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      input, textarea, select { flex: 1; min-width: 160px; background: #fff; }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover { background: var(--accent-deep); }
      button.secondary { background: #fff; color: var(--accent-deep); border: 1px solid var(--line); }
      .mono { font-family: Consolas, "Courier New", monospace; white-space: pre-wrap; font-size: 12.5px; color: var(--muted); }
      .risk-high { color: var(--danger); font-weight: 700; }
      .risk-medium { color: var(--warn); font-weight: 700; }
      .risk-low { color: var(--safe); font-weight: 700; }
      .reasons { margin: 8px 0 0; padding-left: 1.1rem; }
      .edu-card { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
      .edu-card h3 { margin: 0 0 6px; font-size: 1rem; }
      .edu-card ul { margin: 6px 0 0; padding-left: 1.1rem; }
      footer { max-width: 920px; margin: 0 auto 24px; padding: 0 14px; color: var(--muted); font-size: 13px; }
      a { color: var(--accent-deep); }
    </style>
  </head>
  <body>
    <header>
      <h1>ScamShield</h1>
      <p>URLの危険度判定・通報・被害防止ガイドをひとつに。判定は補助情報です。</p>
    </header>
    <main>
      <section>
        <h2>1. URL危険度判定</h2>
        <div class="row">
          <input id="targetUrl" placeholder="https://example.com または怪しいリンク" />
          <button type="button" onclick="checkUrl()">判定する</button>
        </div>
        <textarea id="pageText" rows="3" placeholder="ページ本文を貼ると文言ベースの検知が強化されます（任意）"></textarea>
        <div id="checkSummary"></div>
        <ul id="reasons" class="reasons"></ul>
        <div id="relatedGuides"></div>
      </section>

      <section>
        <h2>2. 通報</h2>
        <div class="row">
          <input id="reportUrl" placeholder="通報するURL" />
          <select id="reportCategory">
            <option value="phishing">フィッシング</option>
            <option value="payment_fraud">支払い詐欺</option>
            <option value="impersonation">なりすまし</option>
            <option value="malware">マルウェア配布</option>
          </select>
        </div>
        <textarea id="reportComment" rows="2" placeholder="補足コメント（任意・匿名）"></textarea>
        <div class="row">
          <button type="button" onclick="submitReport()">通報送信</button>
          <button type="button" class="secondary" onclick="loadReportStats()">統計を更新</button>
        </div>
        <div id="reportResult" class="mono"></div>
        <div id="reportStats" class="mono"></div>
      </section>

      <section>
        <h2>3. 被害防止ガイド</h2>
        <div id="educationList"></div>
      </section>
    </main>
    <footer id="disclaimer"></footer>
    <script>
      const GUIDE_BY_SIGNAL = [
        { match: /タイポ|なりすまし|ブラックリスト/, slug: "impersonation" },
        { match: /支払|ギフト|暗号/, slug: "payment-scam" },
        { match: /至急|誘導|HTTPS|観測/, slug: "urgent-scam" },
      ];

      function reporterHash() {
        const key = "scamshield_reporter";
        let value = localStorage.getItem(key);
        if (!value) {
          value = "web-" + Math.random().toString(36).slice(2, 10);
          localStorage.setItem(key, value);
        }
        return value;
      }

      async function callApi(path, method = "GET", body = null) {
        const res = await fetch(path, {
          method,
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : null,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "API error");
        return data;
      }

      async function checkUrl() {
        try {
          const data = await callApi("/api/check-url", "POST", {
            url: document.getElementById("targetUrl").value,
            page_text: document.getElementById("pageText").value,
          });
          const cls = `risk-${data.risk_level}`;
          document.getElementById("checkSummary").innerHTML =
            `<p class="${cls}">危険度: ${data.risk_level.toUpperCase()}（スコア ${data.risk_score}） / ${data.domain}</p>`;
          document.getElementById("reasons").innerHTML = (data.reasons || [])
            .map((r) => `<li>${r}</li>`)
            .join("");
          document.getElementById("reportUrl").value = data.normalized_url;
          suggestGuides(data.reasons || []);
        } catch (e) {
          document.getElementById("checkSummary").textContent = e.message;
          document.getElementById("reasons").innerHTML = "";
        }
      }

      function suggestGuides(reasons) {
        const joined = reasons.join(" ");
        const slugs = new Set();
        for (const rule of GUIDE_BY_SIGNAL) {
          if (rule.match.test(joined)) slugs.add(rule.slug);
        }
        if (!slugs.size) slugs.add("urgent-scam");
        const links = [...slugs]
          .map((slug) => `<a href="#guide-${slug}">関連ガイド: ${slug}</a>`)
          .join(" · ");
        document.getElementById("relatedGuides").innerHTML = `<p>${links}</p>`;
      }

      async function submitReport() {
        try {
          const data = await callApi("/api/reports", "POST", {
            url: document.getElementById("reportUrl").value,
            category: document.getElementById("reportCategory").value,
            comment: document.getElementById("reportComment").value,
            reporter_hash: reporterHash(),
          });
          document.getElementById("reportResult").textContent = JSON.stringify(data, null, 2);
          await loadReportStats();
        } catch (e) {
          document.getElementById("reportResult").textContent = e.message;
        }
      }

      async function loadReportStats() {
        try {
          document.getElementById("reportStats").textContent = JSON.stringify(
            await callApi("/api/reports/stats"),
            null,
            2
          );
        } catch (e) {
          document.getElementById("reportStats").textContent = e.message;
        }
      }

      async function loadEducation() {
        try {
          const data = await callApi("/api/education");
          document.getElementById("educationList").innerHTML = data.items
            .map(
              (item) => `
            <article class="edu-card" id="guide-${item.slug}">
              <h3>${item.title}</h3>
              <p>${item.summary}</p>
              <ul>${item.checklist.map((c) => `<li>${c}</li>`).join("")}</ul>
            </article>`
            )
            .join("");
        } catch (e) {
          document.getElementById("educationList").textContent = e.message;
        }
      }

      async function loadDisclaimer() {
        try {
          const data = await callApi("/api/disclaimer");
          document.getElementById("disclaimer").textContent = "免責: " + data.text;
        } catch (e) {
          document.getElementById("disclaimer").textContent = "免責文の取得に失敗しました";
        }
      }

      loadDisclaimer();
      loadEducation();
      loadReportStats();
    </script>
  </body>
</html>
